name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Check library and consumer types
        run: bun run check && bun run check:test

      - name: Lint
        run: bun run lint

      - name: Build library
        run: bun run build

      - name: Test PostgreSQL adapter
        run: bun run test:pg

  tauri:
    name: Native Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tauri-plugin-gau -> target
      - name: Check formatting
        run: cargo fmt --manifest-path packages/tauri-plugin-gau/Cargo.toml --check
      - name: Check native code
        run: cargo clippy --locked --manifest-path packages/tauri-plugin-gau/Cargo.toml --all-targets -- -D warnings
      - name: Test native code
        run: cargo test --locked --manifest-path packages/tauri-plugin-gau/Cargo.toml
